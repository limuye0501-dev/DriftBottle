name: iOS Simulator Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          ls /Applications | grep Xcode || true
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: GoogleService-Info.plist (from secret, else placeholder)
        env:
          GSI_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          F=DriftBottle/Resources/GoogleService-Info.plist
          if [ -n "$GSI_B64" ]; then
            echo "$GSI_B64" | base64 --decode > "$F"
            echo "Using GoogleService-Info.plist from secret"
          fi
          if [ ! -f "$F" ]; then
            cat > "$F" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>API_KEY</key><string>AIzaSyDUMMY-PLACEHOLDER-KEY-0000000000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.limuye.driftbottle</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key><string>ci-placeholder.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict></plist>
          PLIST
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project DriftBottle.xcodeproj -scheme DriftBottle -clonedSourcePackagesDirPath SourcePackages

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project DriftBottle.xcodeproj \
            -scheme DriftBottle \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
