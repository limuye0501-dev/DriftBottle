name: ASC build status

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleVersion to wait on
        required: true
        default: "8"

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          KP="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          echo "$P8_B64" | base64 --decode > "$KP"
          chmod 600 "$KP"
          echo "ASC_KEY_PATH=$KP" >> "$GITHUB_ENV"

      - name: Wait until the build is VALID
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 tools/asc/wait_build.py --app 6830465894 --version "${{ inputs.version }}"
