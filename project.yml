name: DriftBottle
options:
  bundleIdPrefix: com.limuye
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: zh-Hans
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  DriftBottle:
    type: application
    platform: iOS
    sources: [DriftBottle]
    info:
      path: DriftBottle/Resources/Info.plist
      properties:
        CFBundleDisplayName: 漂流瓶   # 各语言见 InfoPlist.xcstrings
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [zh-Hans, en, zh-Hant, ja, ko, es, fr, de, pt-BR, it, ru, th, vi, id, tr, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleDevelopmentRegion: zh-Hans
        NSPhotoLibraryUsageDescription: 选择一张图片放进瓶子里
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: DriftBottle/Resources/DriftBottle.entitlements
      properties:
        aps-environment: development   # 归档上架时 Xcode 会按发布描述文件改为 production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limuye.driftbottle
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"          # 仅 iPhone
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"   # iPhone 13 及以上均可升级到 iOS 17
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFunctions
